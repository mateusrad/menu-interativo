<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bar — 15 Anos Bárbara</title>
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500;1,600&family=Lora:ital,wght@0,400;1,400&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column; /* Alinhamento vertical para a assinatura não quebrar */
            align-items: center;
            justify-content: center;
            background: linear-gradient(160deg, #F7DEE5 0%, #FBEAEF 100%);
            padding: 2rem 1rem;
        }

        .card {
            width: 100%;
            max-width: 380px;
            background: #FFFFFF;
            border-radius: 24px;
            padding: 2rem 1.8rem 2.2rem;
            box-shadow: 0 8px 24px rgba(168, 80, 110, 0.15);
            border: 1px solid rgba(168, 80, 110, 0.12);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .btn-voltar {
            align-self: flex-start;
            font-size: 11px;
            font-weight: 700;
            color: #A8506E;
            text-decoration: none;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            transition: color 0.2s ease;
        }

        .btn-voltar:hover { color: #8F3F5A; }

        .badge-15 { width: 56px; height: 56px; border-radius: 50%; border: 2px solid #A8506E; box-shadow: 0 0 0 2px #FFFFFF, 0 0 0 4px #C9A876; display: flex; align-items: center; justify-content: center; margin-bottom: 1.2rem; background: #FFFFFF; }
        .badge-15 span { font-family: 'Montserrat', sans-serif; font-size: 18px; font-weight: 700; color: #A8506E; letter-spacing: -0.02em; }

        .header-name { font-size: 13px; font-weight: 700; letter-spacing: 0.22em; color: #A8506E; text-transform: uppercase; text-align: center; line-height: 1.4; margin-bottom: 0.1rem; }
        .header-sub { font-family: 'Lora', serif; font-style: italic; font-size: 12px; font-weight: 400; letter-spacing: 0.02em; color: #5C3A45; text-align: center; margin-bottom: 1.8rem; }

        .section-title { font-family: 'Cormorant Garamond', serif; font-size: 16px; font-weight: 600; color: #A8506E; margin: 1.4rem 0 0.6rem; align-self: flex-start; border-bottom: 1px solid #C9A876; width: 100%; padding-bottom: 0.2rem; text-transform: uppercase; letter-spacing: 0.1em; }

        .item-list { width: 100%; display: flex; flex-direction: column; gap: 0.75rem; }

        .menu-item { width: 100%; padding: 1rem 1.4rem; border-radius: 18px; background: #fff; color: #5C3A45; font-family: 'Lora', serif; font-size: 13px; font-weight: 400; letter-spacing: 0.01em; box-shadow: 0 2px 8px rgba(168, 80, 110, 0.07); border: 1.5px solid rgba(168, 80, 110, 0.2); line-height: 1.4; }

        /* ── Assinatura ── */
        .developer-signature {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            color: #5C3A45;
            font-size: 11px;
            margin-top: 1.2rem;
            opacity: 0.75;
            transition: opacity 0.2s, color 0.2s;
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .developer-signature:hover { opacity: 1; color: #A8506E; }
        .dev-logo {
            height: 18px;
            width: auto;
            border-radius: 6px;
            display: block;
            mix-blend-mode: multiply;
        }
        .dev-name { font-weight: 700; border-bottom: 1px solid transparent; transition: border-color 0.2s; }
        .developer-signature:hover .dev-name { border-color: #A8506E; }
    </style>
</head>
<body>

<div class="card">
    <a href="index.html" class="btn-voltar">⬅ Voltar</a>

    <div class="badge-15"><span>15</span></div>
    <p class="header-name">Bebidas</p>
    <p class="header-sub">Bar Tradicional</p>

    <h3 class="section-title">Especialidade</h3>
    <div class="item-list">
        <div class="menu-item">Cerveja</div>
    </div>

    <h3 class="section-title">Não Alcoólicos</h3>
    <div class="item-list">
        <div class="menu-item">Refrigerante Tradicional</div>
        <div class="menu-item">Refrigerante Zero</div>
        <div class="menu-item">Água Mineral com Gás</div>
        <div class="menu-item">Água Mineral sem Gás</div>
    </div>
</div>

<a href="https://mateusrad.github.io/portfolio/" target="_blank" class="developer-signature">
    <img src="img/logo_mateus.png" alt="Logo Mateus Rosa Developer" class="dev-logo" />
    <span>Code & Design por <span class="dev-name">Mateus Rosa</span></span>
</a>

</body>
</html>
