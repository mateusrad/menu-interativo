<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fila do Bar — 15 Anos Bárbara</title>
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500;1,600&family=Lora:ital,wght@0,400;1,400&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            background: linear-gradient(160deg, #F7DEE5 0%, #FBEAEF 100%);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        .top-navigation { width: 100%; max-width: 600px; display: flex; margin-bottom: 0.2rem; }
        .btn-voltar { font-size: 11px; font-weight: 700; color: #A8506E; text-decoration: none; letter-spacing: 0.1em; text-transform: uppercase; display: flex; align-items: center; gap: 0.3rem; }

        .logo-header { text-align: center; width: 100%; margin-bottom: 1.2rem; }
        .logo-header h1 { font-family: 'Cormorant Garamond', serif; font-size: 24px; color: #A8506E; letter-spacing: 0.05em; text-transform: uppercase; }
        .logo-header p { font-family: 'Lora', serif; font-style: italic; font-size: 11px; font-weight: 400; color: #5C3A45; letter-spacing: 0.02em; margin-top: 0.1rem; }

        .painel-fila { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 1rem; flex-grow: 1; }

        .coluna { background: #FFFFFF; border-radius: 20px; border: 2px solid rgba(201, 168, 118, 0.35); padding: 1.2rem; display: flex; flex-direction: column; box-shadow: 0 6px 20px rgba(168, 80, 110, 0.06); overflow: hidden; }
        .coluna-pronto { background: #FFFFFF; border: 2px solid #A8506E; box-shadow: 0 12px 30px rgba(168, 80, 110, 0.18); transform: scale(1.02); }

        .coluna-titulo { font-size: 13px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; text-align: center; margin: -1.2rem -1.2rem 1rem -1.2rem; padding: 0.9rem 0.5rem; }
        .titulo-preparando { color: #8F3F5A; background: #FBEAEF; border-bottom: 2px solid #C9A876; }
        .titulo-pronto { color: #FFFFFF; background: linear-gradient(90deg, #A8506E, #8F3F5A); border-bottom: 2px solid #C9A876; font-size: 14px; }

        .divisor-fila { display: flex; align-items: center; justify-content: center; gap: 0.6rem; color: #5C3A45; font-size: 9px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; opacity: 0.7; }
        .divisor-fila::before, .divisor-fila::after { content: ""; height: 1px; width: 60px; background: rgba(168, 80, 110, 0.25); }

        .lista-nomes { display: flex; flex-direction: column; gap: 0.5rem; }

        .item-fila { background: #fff; padding: 0.8rem 1.2rem; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(168, 80, 110, 0.15); flex-wrap: wrap; gap: 8px;}
        .item-fila .nome { font-size: 14px; font-weight: 700; color: #5C3A45; }

        .drink-wrap { display: flex; align-items: center; gap: 6px; }
        .item-fila .drink { font-family: 'Lora', serif; font-size: 10.5px; font-weight: 400; color: #5C3A45; letter-spacing: 0.01em; background: #FBEAEF; padding: 0.2rem 0.5rem; border-radius: 6px; }

        .mesa-tag-fila { font-family: 'Montserrat', sans-serif; font-size: 9.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #fff; background: #A8506E; padding: 0.2rem 0.5rem; border-radius: 6px; }

        /* Etiquetas de Álcool */
        .badge-alcool-fila { font-size: 8px; font-weight: 800; padding: 0.2rem 0.4rem; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.05em;}
        .fila-tag-com { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2;}
        .fila-tag-sem { background: #e6f6ec; color: #2e7d32; border: 1px solid #c8e6c9;}

        .badge-status { font-size: 9px; font-weight: 800; padding: 4px 8px; border-radius: 8px; text-transform: uppercase; letter-spacing: 0.05em; margin-left: auto; }
        .status-preparando { background: #fff3e0; color: #e65100; border: 1px solid #ffe0b2; }
        .status-pronto { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }

        .coluna-pronto .item-fila { border-color: #A8506E; animation: pulse-brilho 2s infinite alternate; }
        .coluna-pronto .item-fila .nome { color: #A8506E; font-size: 15px; }
        .coluna-pronto .item-fila .drink { background: #FBEAEF; color: #A8506E; }

        @keyframes pulse-brilho {
            0% { box-shadow: 0 2px 6px rgba(168, 80, 110, 0.03); }
            100% { box-shadow: 0 4px 12px rgba(168, 80, 110, 0.18); border-color: #C9A876; }
        }

        .live-bar { width: 100%; max-width: 600px; display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-bottom: 1rem; font-size: 10.5px; font-weight: 600; color: #5C3A45; letter-spacing: 0.08em; text-transform: uppercase; }
        .live-dot { width: 7px; height: 7px; border-radius: 50%; background: #81c784; flex-shrink: 0; animation: piscar 1.8s ease-in-out infinite; }

        @keyframes piscar { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }

        .sem-pedidos { font-family: 'Lora', serif; text-align: center; color: #5C3A45; font-size: 11px; font-style: italic; padding: 1rem 0; }

        /* ── Aviso de drink pronto ── */
        .aviso-pronto {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: linear-gradient(135deg, #A8506E, #8F3F5A);
            color: #fff;
            padding: 1rem 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            transform: translateY(-100%);
            transition: transform 0.4s ease;
            z-index: 3000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
        }
        .aviso-pronto.show { transform: translateY(0); }
        .aviso-pronto-emoji { font-size: 28px; flex-shrink: 0; }
        .aviso-pronto-texto { flex: 1; display: flex; flex-direction: column; }
        .aviso-pronto-texto strong { font-family: 'Montserrat', sans-serif; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; }
        .aviso-pronto-texto span { font-family: 'Lora', serif; font-style: italic; font-size: 12px; opacity: 0.9; }
        .aviso-pronto-fechar { background: none; border: none; color: #fff; font-size: 20px; line-height: 1; cursor: pointer; opacity: 0.8; flex-shrink: 0; }
        .aviso-pronto-fechar:hover { opacity: 1; }

        .developer-signature { display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; color: #5C3A45; font-size: 11px; margin-top: 2rem; margin-bottom: 1rem; opacity: 0.75; transition: opacity 0.2s, color 0.2s; font-family: 'Montserrat', sans-serif; text-transform: uppercase; letter-spacing: 0.05em; width: 100%; }
        .developer-signature:hover { opacity: 1; color: #A8506E; }
        .dev-logo { height: 18px; width: auto; border-radius: 6px; display: block; mix-blend-mode: multiply; }
        .dev-name { font-weight: 700; border-bottom: 1px solid transparent; transition: border-color 0.2s; }
        .developer-signature:hover .dev-name { border-color: #A8506E; }
    </style>
</head>
<body>

<div class="top-navigation">
    <a href="drinks.html" class="btn-voltar" id="btnVoltar">⬅ Voltar</a>
</div>

<div class="logo-header">
    <h1>Painel do Bar</h1>
    <p>Acompanhe e retire seu copo</p>
</div>

<div class="live-bar">
    <span class="live-dot"></span>
    <span>Ao vivo · Atualizado às <span id="horaUpdate">--:--</span></span>
</div>

<div class="painel-fila">
    <div class="coluna coluna-pronto">
        <h2 class="coluna-titulo titulo-pronto">✨ Prontos para Retirada (Retirar no Balcão)</h2>
        <div class="lista-nomes" id="listaPronto">
        </div>
    </div>

    <div class="divisor-fila">Em seguida</div>

    <div class="coluna">
        <h2 class="coluna-titulo titulo-preparando">⏳ Preparando os Próximos Drinks</h2>
        <div class="lista-nomes" id="listaPreparando">
        </div>
    </div>
</div>

<div class="aviso-pronto" id="avisoPronto">
    <span class="aviso-pronto-emoji">🍹</span>
    <div class="aviso-pronto-texto">
        <strong>Seu drink está pronto!</strong>
        <span id="avisoProntoDrink"></span>
    </div>
    <button class="aviso-pronto-fechar" onclick="document.getElementById('avisoPronto').classList.remove('show')">✕</button>
</div>

<a href="https://mateusrad.github.io/portfolio/" target="_blank" class="developer-signature">
    <img src="img/logo_mateus.png" alt="Logo Mateus Rosa Developer" class="dev-logo" />
    <span>Code & Design por <span class="dev-name">Mateus Rosa</span></span>
</a>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Preserva a mesa (vinda do QR) ao voltar pro cardápio de drinks.
    const mesaAtual = new URLSearchParams(window.location.search).get('mesa');
    if (mesaAtual) {
        document.getElementById('btnVoltar').href = `drinks.html?mesa=${encodeURIComponent(mesaAtual)}`;
    }

    const firebaseConfig = {
        apiKey: "AIzaSyAsCh0k2Kx6jiS1R3mJtAvhMaIY00up-2E",
        authDomain: "menu-interativo-faaec.firebaseapp.com",
        databaseURL: "https://menu-interativo-faaec-default-rtdb.firebaseio.com",
        projectId: "menu-interativo-faaec",
        storageBucket: "menu-interativo-faaec.firebasestorage.app",
        messagingSenderId: "1046837961375",
        appId: "1:1046837961375:web:430ec81a42e46a0ccb38aa"
    };

    // Evita XSS: nomes de convidados vêm de input livre e são inseridos via innerHTML
    function escapeHtml(str) {
        return String(str ?? '').replace(/[&<>"']/g, (c) => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
    }

    // ── Aviso de "drink pronto" enquanto a aba fica aberta (mesma lógica do drinks.html) ──
    const PEDIDOS_AVISO_KEY = 'pedidosAguardandoAviso';

    function avisarPedidoPronto(nomeDrink) {
        if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 200]);

        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.value = 880;
            gain.gain.setValueAtTime(0.15, ctx.currentTime);
            osc.start();
            osc.stop(ctx.currentTime + 0.4);
        } catch (e) { /* navegador sem suporte a Web Audio, ignora */ }

        const tituloOriginal = document.title;
        let piscadas = 0;
        const piscaTitulo = setInterval(() => {
            document.title = (piscadas % 2 === 0) ? '🍹 SEU DRINK ESTÁ PRONTO!' : tituloOriginal;
            piscadas++;
            if (piscadas >= 10) {
                clearInterval(piscaTitulo);
                document.title = tituloOriginal;
            }
        }, 800);

        if ('Notification' in window && Notification.permission === 'granted') {
            try { new Notification('🍹 Seu drink está pronto!', { body: `${nomeDrink} te espera no balcão.` }); } catch (e) {}
        }

        const banner = document.getElementById('avisoPronto');
        document.getElementById('avisoProntoDrink').textContent = nomeDrink;
        banner.classList.add('show');
    }

    function verificarPedidosProntos(dadosSnapshot) {
        const pendentes = JSON.parse(localStorage.getItem(PEDIDOS_AVISO_KEY) || '[]');
        if (pendentes.length === 0) return;

        const aindaPendentes = [];
        pendentes.forEach((pedidoSalvo) => {
            const atual = dadosSnapshot ? dadosSnapshot[pedidoSalvo.id] : null;
            if (atual && atual.status === 'pronto') {
                avisarPedidoPronto(pedidoSalvo.drink);
            } else {
                aindaPendentes.push(pedidoSalvo);
            }
        });
        localStorage.setItem(PEDIDOS_AVISO_KEY, JSON.stringify(aindaPendentes));
    }

    // NOVA LISTA CORRETA DE DRINKS COM ÁLCOOL
    const drinksComAlcool = [
        'Drink da Aniversariante (Com Álcool)',
        'Piña Colada (Com Álcool)',
        'Lagoa Azul (Com Álcool)',
        'Gin Morango e Pêssego',
        'Caipirinhas Variadas',
        'Gin Tônica com Especiarias',
        'Sex on the Beach'
    ];

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);
    const pedidosRef = ref(database, 'pedidos');

    onValue(pedidosRef, (snapshot) => {
        const agora = new Date();
        document.getElementById('horaUpdate').innerText = agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

        const divPreparando = document.getElementById('listaPreparando');
        const divPronto = document.getElementById('listaPronto');

        divPreparando.innerHTML = "";
        divPronto.innerHTML = "";

        if (!snapshot.exists()) {
            divPreparando.innerHTML = '<div class="sem-pedidos">Nenhum drink na fila.</div>';
            divPronto.innerHTML = '<div class="sem-pedidos">Nenhum drink no balcão.</div>';
            return;
        }

        const dados = snapshot.val();
        verificarPedidosProntos(dados);
        const lista = Object.keys(dados).map(key => dados[key]);
        lista.sort((a, b) => (a.dataHora || 0) - (b.dataHora || 0));

        let contPronto = 0;
        let contPendente = 0;

        lista.forEach((pedido) => {
            // Verifica o álcool para a fila também (usa o nome bruto, com sufixo se houver)
            let tagAlcool = '';
            if (drinksComAlcool.includes(pedido.drink)) {
                tagAlcool = `<span class="badge-alcool-fila fila-tag-com">🔞 Com Álcool</span>`;
            } else {
                tagAlcool = `<span class="badge-alcool-fila fila-tag-sem">🟢 Sem Álcool</span>`;
            }

            // Nome exibido: remove o sufixo "(Com/Sem Álcool)" pois o badge já informa isso
            const nomeExibido = escapeHtml((pedido.drink || '').replace(/\s*\((Com|Sem)\s*Álcool\)\s*$/i, ''));
            const nomeConvidado = escapeHtml(pedido.convidado);
            const mesaTag = pedido.mesa ? `<span class="mesa-tag-fila">🪑 Mesa ${escapeHtml(String(pedido.mesa))}</span>` : '';

            const item = document.createElement('div');
            item.className = 'item-fila';

            let badgeStatus = '';
            if ((pedido.status === "pendente" || pedido.status === "fazendo") && contPendente < 5) {
                badgeStatus = `<span class="badge-status status-preparando">Preparando</span>`;
                item.innerHTML = `<span class="nome">${nomeConvidado}</span>${mesaTag}<div class="drink-wrap"><span class="drink">${nomeExibido}</span>${tagAlcool}</div>${badgeStatus}`;
                divPreparando.appendChild(item);
                contPendente++;
            } else if (pedido.status === "pronto" && contPronto < 5) {
                badgeStatus = `<span class="badge-status status-pronto">Pronto</span>`;
                item.innerHTML = `<span class="nome">${nomeConvidado}</span>${mesaTag}<div class="drink-wrap"><span class="drink">${nomeExibido}</span>${tagAlcool}</div>${badgeStatus}`;
                divPronto.appendChild(item);
                contPronto++;
            }
        });

        if (contPendente === 0) divPreparando.innerHTML = '<div class="sem-pedidos">Nenhum drink na fila.</div>';
        if (contPronto === 0) divPronto.innerHTML = '<div class="sem-pedidos">Nenhum drink no balcão.</div>';
    });
</script>

</body>
</html>
