<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu — 15 Anos Bárbara</title>
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500;1,600&family=Lora:ital,wght@0,400;1,400&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(160deg, #F7DEE5 0%, #FBEAEF 100%);
            padding: 2rem 1rem;
        }

        .card {
            width: 100%;
            max-width: 380px;
            background: #FFFFFF;
            border-radius: 24px;
            padding: 2.4rem 1.8rem 2.2rem;
            box-shadow: 0 8px 24px rgba(168, 80, 110, 0.15);
            border: 1px solid rgba(168, 80, 110, 0.12);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
        }

        /* ── Medalhão "15" ── */
        .badge-15 {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: 2px solid #A8506E;
            box-shadow: 0 0 0 2px #FFFFFF, 0 0 0 4px #C9A876;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.2rem;
            background: #FFFFFF;
        }

        .badge-15 span {
            font-family: 'Montserrat', sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: #A8506E;
            letter-spacing: -0.02em;
        }

        /* ── Header ── */
        .header-name {
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.22em;
            color: #A8506E;
            text-transform: uppercase;
            text-align: center;
            line-height: 1.4;
            margin-bottom: 0.1rem;
        }

        .header-sub {
            font-family: 'Lora', serif;
            font-style: italic;
            font-size: 12px;
            font-weight: 400;
            letter-spacing: 0.02em;
            color: #5C3A45;
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .mesa-badge {
            display: none;
            font-family: 'Montserrat', sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #A8506E;
            background: #FBEAEF;
            border: 1px solid rgba(168, 80, 110, 0.25);
            border-radius: 999px;
            padding: 0.4rem 1rem;
            margin-bottom: 1rem;
        }

        /* ── Cronômetro do Bar ── */
        #bar-timer {
            font-size: 11px;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 0.5rem;
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        .timer-waiting { background: #FBEAEF; color: #A8506E; border: 1px solid rgba(168, 80, 110, 0.25); }
        .timer-open { background: #e6f4ea; color: #1e8e3e; border: 1px solid #ceead6; }
        .timer-closed { background: #fce8e6; color: #d93025; border: 1px solid #fad2cf; }

        .bar-horarios {
            font-family: 'Lora', serif;
            font-style: italic;
            font-size: 10.5px;
            font-weight: 400;
            color: #5C3A45;
            opacity: 0.75;
            text-align: center;
            margin-bottom: 1.2rem;
        }

        /* ── Botões Padrão ── */
        .btn-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .btn-menu {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 1rem 1.2rem 1rem 1.4rem;
            border-radius: 999px;
            border: 1.5px solid rgba(168, 80, 110, 0.25);
            background: #fff;
            color: #A8506E;
            font-family: 'Montserrat', sans-serif;
            font-size: 11.5px;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.22s ease;
            box-shadow: 0 2px 8px rgba(168, 80, 110, 0.08);
        }

        .btn-menu:hover {
            background: #FBEAEF;
            border-color: #A8506E;
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(168, 80, 110, 0.18);
        }

        .btn-menu:active { transform: translateY(0); }
        .btn-menu .icon { font-size: 17px; flex-shrink: 0; }
        .btn-menu .label { flex: 1; text-align: left; padding-left: 0.9rem; }

        /* ── Botão Interativo (Drinks) DESTAQUE ── */
        .btn-interactive {
            background: linear-gradient(135deg, #A8506E 0%, #8F3F5A 100%);
            color: #fff !important;
            border: none;
            box-shadow: 0 6px 20px rgba(168, 80, 110, 0.4);
            padding: 1.2rem 1.2rem 1.2rem 1.4rem;
        }

        .btn-interactive:hover {
            background: linear-gradient(135deg, #8F3F5A 0%, #772f49 100%);
            box-shadow: 0 8px 25px rgba(168, 80, 110, 0.5);
        }

        .btn-interactive .label-wrap {
            display: flex;
            flex-direction: column;
            flex: 1;
            padding-left: 0.9rem;
            text-align: left;
        }

        .btn-interactive .title {
            font-size: 13px;
            font-weight: 800;
            color: #fff;
            letter-spacing: 0.1em;
            margin-bottom: 2px;
        }

        .btn-interactive .subtitle {
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 0.08em;
            color: #FBEAEF;
            text-transform: uppercase;
        }

        /* ── Assinatura ── */
        .developer-signature {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            color: #5C3A45;
            font-size: 11px;
            margin-top: 1.2rem;
            opacity: 0.75;
            transition: opacity 0.2s, color 0.2s;
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .developer-signature:hover { opacity: 1; color: #A8506E; }
        .dev-logo {
            height: 18px;
            width: auto;
            border-radius: 6px;
            display: block;
            mix-blend-mode: multiply;
        }
        .dev-name { font-weight: 700; border-bottom: 1px solid transparent; transition: border-color 0.2s; }
        .developer-signature:hover .dev-name { border-color: #A8506E; }
    </style>
</head>
<body>

<script>
    // --- Trava temporária de acesso, só pra evitar acesso casual antes da festa
    // (ex: alguém na gráfica testando o QR impresso). Não é segurança real — quem vir
    // o código-fonte vê a senha. Libera sozinha a partir da data configurada abaixo.
    const SENHA_MENU = "bar15anos";
    const AUTH_KEY = "menuAuth";
    const DATA_LIBERACAO = new Date("2026-09-06T00:00:00").getTime();

    function acessoLiberado() {
        if (Date.now() >= DATA_LIBERACAO) return true;
        return sessionStorage.getItem(AUTH_KEY) === "ok";
    }

    function pedirSenha() {
        for (let tentativas = 0; tentativas < 3; tentativas++) {
            const digitada = prompt("Menu ainda não liberado. Senha de acesso:");
            if (digitada === null) break;
            if (digitada === SENHA_MENU) {
                sessionStorage.setItem(AUTH_KEY, "ok");
                return true;
            }
        }
        return false;
    }

    if (!acessoLiberado() && !pedirSenha()) {
        document.write('<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:sans-serif;color:#5C3A45;text-align:center;padding:2rem;">Este menu ainda não está disponível.</div>');
        document.close();
        throw new Error("Acesso bloqueado até a data de liberação.");
    }
</script>

<div class="card">

    <div class="badge-15"><span>15</span></div>
    <p class="header-name">15 anos da<br>Bárbara</p>
    <p class="header-sub"></p>
    <p class="mesa-badge" id="mesaBadge"></p>

    <div id="bar-timer" class="timer-waiting">⏳ Carregando status do bar...</div>
    <p class="bar-horarios">Bar aberto das 19h20 às 20h20 e das 21h30 à 00h30</p>

    <div class="btn-list">

        <a href="drinks.html" id="btn-drinks" class="btn-menu btn-interactive">
            <div class="label-wrap">
                <span class="title">Bar de Drinks (Interativo)</span>
                <span class="subtitle">► Clique para fazer seu pedido</span>
            </div>
            <span class="icon">🍹</span>
        </a>

        <a href="bar.html" class="btn-menu">
            <span class="label">Bebidas Convencionais</span>
            <span class="icon">🍻</span>
        </a>

        <a href="buffet.html" class="btn-menu">
            <span class="label">Cardápio do Buffet</span>
            <span class="icon">🍽️</span>
        </a>

        <a href="doces.html" class="btn-menu">
            <span class="label">Seleção de Doces</span>
            <span class="icon">🧁</span>
        </a>

        <a href="fila.html" class="btn-menu" style="background: #fffbfd; border-color: rgba(168, 80, 110, 0.25);">
            <span class="label" style="color: #A8506E;">Fila de Espera (Drinks)</span>
            <span class="icon">⏳</span>
        </a>

    </div>

</div>

<a href="https://mateusrad.github.io/portfolio/" target="_blank" class="developer-signature">
    <img src="img/logo_mateus.png" alt="Logo Mateus Rosa Developer" class="dev-logo" />
    <span>Code & Design por <span class="dev-name">Mateus Rosa</span></span>
</a>

<script>
    // Número da mesa vem do QR code lido (ex: index.html?mesa=5). Repassa pro link de drinks,
    // que é a única página que precisa dessa informação junto com o pedido.
    const mesaAtual = new URLSearchParams(window.location.search).get('mesa');
    if (mesaAtual) {
        const badge = document.getElementById('mesaBadge');
        badge.textContent = `🪑 Mesa ${mesaAtual}`;
        badge.style.display = 'inline-block';

        const btnDrinks = document.getElementById('btn-drinks');
        btnDrinks.href = `drinks.html?mesa=${encodeURIComponent(mesaAtual)}`;
    }

    // Lógica do Cronômetro do Bar
    // CONFIGURAÇÃO: janelas de funcionamento combinadas com a cerimonialista
    const janelasBar = [
        { abre: new Date("2026-09-06T19:20:00").getTime(), fecha: new Date("2026-09-06T20:20:00").getTime() },
        { abre: new Date("2026-09-06T21:30:00").getTime(), fecha: new Date("2026-09-07T00:30:00").getTime() }
    ];

    function formatarDistancia(distance) {
        const dias = Math.floor(distance / (1000 * 60 * 60 * 24));
        const horas = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutos = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const segundos = Math.floor((distance % (1000 * 60)) / 1000);

        let texto = dias > 0 ? `${dias}d ` : '';
        texto += `${horas}h ${minutos}m ${segundos}s`;
        return texto;
    }

    function updateBarTimer() {
        const now = new Date().getTime();

        const timerEl = document.getElementById("bar-timer");
        const btnDrinks = document.getElementById("btn-drinks");

        const janelaAberta = janelasBar.find(j => now >= j.abre && now < j.fecha);

        if (janelaAberta) {
            const distance = janelaAberta.fecha - now;
            timerEl.className = "timer-open";
            timerEl.innerHTML = `🟢 BAR DE DRINKS ABERTO! Encerra em: ${formatarDistancia(distance)}`;

            btnDrinks.style.pointerEvents = "auto";
            btnDrinks.style.opacity = "1";
            return;
        }

        const proximaJanela = janelasBar.find(j => now < j.abre);

        if (proximaJanela) {
            const distance = proximaJanela.abre - now;
            timerEl.className = "timer-waiting";
            timerEl.innerHTML = `⏳ O Bar de Drinks abre em: ${formatarDistancia(distance)}`;

            // COMENTADO PARA FASE DE DESENVOLVIMENTO:
            // btnDrinks.style.pointerEvents = "none";
            // btnDrinks.style.opacity = "0.6";
            return;
        }

        timerEl.className = "timer-closed";
        timerEl.innerHTML = `🔴 O Bar de Drinks está encerrado.`;

        // COMENTADO PARA FASE DE DESENVOLVIMENTO:
        // btnDrinks.style.pointerEvents = "none";
        // btnDrinks.style.opacity = "0.6";
    }

    setInterval(updateBarTimer, 1000);
    updateBarTimer();
</script>

</body>
</html>
