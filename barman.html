<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Barman — 15 Anos Bárbara</title>
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@1,400&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Montserrat', sans-serif; min-height: 100vh; background: #0f0407; color: #fff; padding: 1.5rem; }
        .container { width: 100%; max-width: 1200px; margin: 0 auto; }

        header { text-align: center; margin-bottom: 2rem; border-bottom: 2px solid #A8506E; padding-bottom: 1rem; }
        header h1 { font-size: 22px; letter-spacing: 0.15em; text-transform: uppercase; color: #F7DEE5; }
        header p { font-size: 11px; color: #C9A876; margin-top: 0.3rem; text-transform: uppercase; letter-spacing: 0.1em; }
        .btn-tela-cheia { margin-top: 0.8rem; padding: 0.5rem 1rem; border-radius: 999px; border: 1px solid rgba(201, 168, 118, 0.5); background: transparent; color: #C9A876; font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; }
        .btn-tela-cheia:hover { background: rgba(201, 168, 118, 0.15); }

        .painel-trabalho { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1.5rem; }
        .col-barman { background: #1a080e; border-radius: 20px; padding: 1.2rem; border: 1px solid rgba(168, 80, 110, 0.2); display: flex; flex-direction: column; gap: 1rem; }

        .titulo-col { font-size: 13px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; padding-bottom: 0.5rem; border-bottom: 1px solid rgba(168, 80, 110, 0.3); }
        .tit-pendente { color: #ffb74d; }
        .tit-fazendo { color: #C9A876; }
        .tit-pronto { color: #81c784; }

        .card-pedido { background: linear-gradient(135deg, #260f16 0%, #361822 100%); border: 1px solid rgba(168, 80, 110, 0.3); border-radius: 14px; padding: 1rem; display: flex; flex-direction: column; gap: 0.8rem; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
        .info-pedido { display: flex; flex-direction: column; gap: 0.25rem; }
        .nome-convidado { font-size: 15px; font-weight: 700; color: #fff; }
        .nome-drink { font-size: 12px; font-weight: 600; color: #F7DEE5; text-transform: uppercase; letter-spacing: 0.05em; }
        .horario { font-size: 9.5px; color: #C9A876; margin-top: 0.2rem; }

        .badge-alcool { align-self: flex-start; padding: 0.25rem 0.6rem; border-radius: 6px; font-size: 9px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; margin-top: 0.1rem; font-family: 'Montserrat', sans-serif; }
        .badge-com { background: #ff4444; color: #fff; border: 1px solid #ffcccc; }
        .badge-sem { background: #00c851; color: #fff; border: 1px solid #ccffcc; }
        .badge-mesa { display: block; width: 100%; text-align: center; padding: 0.5rem; border-radius: 10px; font-size: 18px; font-weight: 800; letter-spacing: 0.03em; text-transform: uppercase; font-family: 'Montserrat', sans-serif; background: #F7DEE5; color: #5C1F30; box-shadow: 0 0 16px rgba(247, 222, 229, 0.5); border: 2px solid #fff; white-space: nowrap; }

        .btn-acao { width: 100%; padding: 0.75rem; border-radius: 999px; font-family: 'Montserrat', sans-serif; font-size: 11.5px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; border: none; transition: all 0.2s ease; }
        .btn-iniciar { background: #C9A876; color: #2a1f10; box-shadow: 0 0 10px rgba(201, 168, 118, 0.5); }
        .btn-iniciar:hover { background: #d9bd8f; box-shadow: 0 0 15px rgba(201, 168, 118, 0.7); }
        .btn-concluir { background: #A8506E; color: #fff; box-shadow: 0 0 10px rgba(168, 80, 110, 0.5); }
        .btn-concluir:hover { background: #8F3F5A; box-shadow: 0 0 15px rgba(168, 80, 110, 0.7); }
        .btn-entregar { background: #00c851; color: #fff; box-shadow: 0 0 10px rgba(0, 200, 81, 0.4); }
        .btn-entregar:hover { background: #00e676; box-shadow: 0 0 15px rgba(0, 200, 81, 0.6); }

        .sem-pedidos { font-family: 'Lora', serif; text-align: center; color: #8c606d; font-size: 12px; padding: 2rem 0; font-style: italic; }
        @media (max-width: 900px) { .painel-trabalho { grid-template-columns: 1fr; } }

        .toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%) translateY(20px); background: #1e0b11; border: 1.5px solid rgba(168, 80, 110, 0.4); border-radius: 14px; padding: 0.9rem 1.3rem; box-shadow: 0 8px 28px rgba(0,0,0,0.4); display: flex; align-items: center; gap: 0.7rem; max-width: 320px; width: calc(100% - 2rem); z-index: 2000; opacity: 0; pointer-events: none; transition: opacity 0.3s ease, transform 0.3s ease; }
        .toast.show { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
        .toast-icon { font-size: 18px; flex-shrink: 0; }
        .toast-body { display: flex; flex-direction: column; gap: 0.1rem; }
        .toast-title { font-size: 11px; font-weight: 700; color: #F7DEE5; letter-spacing: 0.08em; text-transform: uppercase; }
        .toast-msg { font-family: 'Lora', serif; font-size: 11px; color: #C9A876; line-height: 1.4; }
        .toast.toast-erro { border-color: rgba(198, 40, 40, 0.4); }
        .toast.toast-erro .toast-title { color: #ef9a9a; }
    </style>
</head>
<body>

<div class="toast" id="toastNotif">
    <span class="toast-icon" id="toastIcone">✅</span>
    <div class="toast-body">
        <span class="toast-title" id="toastTitulo"></span>
        <span class="toast-msg" id="toastMensagem"></span>
    </div>
</div>

<div class="container">
    <header>
        <h1>Painel do Bartender</h1>
        <p>Controle de Fluxo e Entregas</p>
        <button id="btnTelaCheia" class="btn-tela-cheia">⛶ Tela Cheia</button>
    </header>

    <div class="painel-trabalho">
        <div class="col-barman">
            <h2 class="titulo-col tit-pendente">📥 Para Fazer</h2>
            <div id="listaPendentes">
                <div class="sem-pedidos">Nenhum drink pendente...</div>
            </div>
        </div>

        <div class="col-barman">
            <h2 class="titulo-col tit-fazendo">🥃 Fazendo</h2>
            <div id="listaFazendo">
                <div class="sem-pedidos">Nenhum drink em preparo...</div>
            </div>
        </div>

        <div class="col-barman">
            <h2 class="titulo-col tit-pronto">🛎️ No Balcão</h2>
            <div id="listaProntos">
                <div class="sem-pedidos">Nenhum drink aguardando retirada...</div>
            </div>
        </div>
    </div>
</div>

<script type="module">
    // --- Gate de senha (proteção simples, não é segurança real: qualquer um com acesso
    // ao código-fonte vê a senha. A proteção de verdade está nas regras do Firebase. ---
    const SENHA_BARMAN = "barman26";
    const AUTH_KEY = "barmanAuth";

    function acessoLiberado() {
        return sessionStorage.getItem(AUTH_KEY) === "ok";
    }

    function pedirSenha() {
        for (let tentativas = 0; tentativas < 3; tentativas++) {
            const digitada = prompt("Senha do painel do barman:");
            if (digitada === null) break; // cancelou
            if (digitada === SENHA_BARMAN) {
                sessionStorage.setItem(AUTH_KEY, "ok");
                return true;
            }
        }
        return false;
    }

    if (!acessoLiberado() && !pedirSenha()) {
        document.body.innerHTML = `
            <div class="container">
                <header>
                    <h1>Acesso Negado</h1>
                    <p>Senha incorreta ou não informada</p>
                </header>
            </div>`;
        throw new Error("Acesso não autorizado ao painel do barman.");
    }

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, update, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAsCh0k2Kx6jiS1R3mJtAvhMaIY00up-2E",
        authDomain: "menu-interativo-faaec.firebaseapp.com",
        databaseURL: "https://menu-interativo-faaec-default-rtdb.firebaseio.com",
        projectId: "menu-interativo-faaec",
        storageBucket: "menu-interativo-faaec.firebasestorage.app",
        messagingSenderId: "1046837961375",
        appId: "1:1046837961375:web:430ec81a42e46a0ccb38aa"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);
    const pedidosRef = ref(database, 'pedidos');

    // Mantém a tela ligada enquanto o painel do barman estiver aberto (evita
    // o celular/tablet apagar a tela por inatividade durante o serviço).
    let wakeLock = null;
    async function pedirWakeLock() {
        if (!('wakeLock' in navigator)) return;
        try {
            wakeLock = await navigator.wakeLock.request('screen');
        } catch (err) {
            console.warn('Wake Lock indisponível:', err);
        }
    }
    pedirWakeLock();
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') pedirWakeLock();
    });

    // Tela cheia: além de tirar a barra de endereço/UI do navegador (que é o
    // que costuma deixar o tablet "achar" que está ocioso e apagar a tela),
    // o clique também serve de gesto do usuário pra reforçar o Wake Lock —
    // em alguns navegadores o pedido silencioso do carregamento da página
    // pode ser recusado sem essa interação direta.
    const btnTelaCheia = document.getElementById('btnTelaCheia');
    btnTelaCheia.addEventListener('click', () => {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen?.().catch((err) => {
                console.warn('Não foi possível entrar em tela cheia:', err);
            });
        } else {
            document.exitFullscreen?.();
        }
        pedirWakeLock();
    });
    document.addEventListener('fullscreenchange', () => {
        btnTelaCheia.textContent = document.fullscreenElement ? '⛶ Sair da Tela Cheia' : '⛶ Tela Cheia';
    });

    // Evita XSS: nomes de convidados vêm de input livre e são inseridos via innerHTML
    function escapeHtml(str) {
        return String(str ?? '').replace(/[&<>"']/g, (c) => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
    }

    // NOVA LISTA CORRETA DE DRINKS COM ÁLCOOL (Identifica perfeitamente)
    const drinksComAlcool = [
        'Drink da Aniversariante (Com Álcool)',
        'Piña Colada (Com Álcool)',
        'Lagoa Azul (Com Álcool)',
        'Gin Morango e Pêssego (Com Álcool)',
        'Caipirinhas Variadas',
        'Gin Tônica com Especiarias',
        'Sex on the Beach'
    ];

    onValue(pedidosRef, (snapshot) => {
        const divPendentes = document.getElementById('listaPendentes');
        const divFazendo = document.getElementById('listaFazendo');
        const divProntos = document.getElementById('listaProntos');

        divPendentes.innerHTML = "";
        divFazendo.innerHTML = "";
        divProntos.innerHTML = "";

        if (!snapshot.exists()) {
            divPendentes.innerHTML = '<div class="sem-pedidos">Nenhum drink pendente...</div>';
            divFazendo.innerHTML = '<div class="sem-pedidos">Nenhum drink em preparo...</div>';
            divProntos.innerHTML = '<div class="sem-pedidos">Nenhum drink aguardando retirada...</div>';
            return;
        }

        const dados = snapshot.val();
        const listaOrdenada = Object.keys(dados).map(key => ({ id: key, ...dados[key] }));
        listaOrdenada.sort((a, b) => (a.dataHora || 0) - (b.dataHora || 0));

        let qtdPendentes = 0;
        let qtdFazendo = 0;
        let qtdProntos = 0;

        listaOrdenada.forEach((pedido) => {
            let horaFormatada = "";
            if (pedido.dataHora) {
                const data = new Date(pedido.dataHora);
                horaFormatada = data.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
            }

            let badgeHtml = "";
            if (drinksComAlcool.includes(pedido.drink)) {
                badgeHtml = `<span class="badge-alcool badge-com">🔞 COM ÁLCOOL</span>`;
            } else {
                badgeHtml = `<span class="badge-alcool badge-sem">🟢 SEM ÁLCOOL</span>`;
            }

            // Nome exibido: remove o sufixo "(Com/Sem Álcool)" pois o badge já informa isso
            const nomeExibido = escapeHtml((pedido.drink || '').replace(/\s*\((Com|Sem)\s*Álcool\)\s*$/i, ''));
            const nomeConvidado = escapeHtml(pedido.convidado);
            const mesaHtml = pedido.mesa ? `<span class="badge-mesa">🪑 Mesa ${escapeHtml(String(pedido.mesa))}</span>` : '';

            const card = document.createElement('div');
            card.className = 'card-pedido';

            if (pedido.status === "pendente") {
                qtdPendentes++;
                card.innerHTML = `
                    <div class="info-pedido">
                        ${mesaHtml}
                        <span class="nome-convidado">${nomeConvidado}</span>
                        <span class="nome-drink">${nomeExibido}</span>
                        ${badgeHtml}
                        <span class="horario">Pedido às ${horaFormatada}</span>
                    </div>
                    <button class="btn-acao btn-iniciar" onclick="mudarStatus('${pedido.id}', 'fazendo')">Iniciar ▶</button>
                `;
                divPendentes.appendChild(card);
            } else if (pedido.status === "fazendo") {
                qtdFazendo++;
                card.innerHTML = `
                    <div class="info-pedido">
                        ${mesaHtml}
                        <span class="nome-convidado">${nomeConvidado}</span>
                        <span class="nome-drink">${nomeExibido}</span>
                        ${badgeHtml}
                        <span class="horario">Pedido às ${horaFormatada}</span>
                    </div>
                    <button class="btn-acao btn-concluir" onclick="mudarStatus('${pedido.id}', 'pronto')">Concluir ➔</button>
                `;
                divFazendo.appendChild(card);
            } else if (pedido.status === "pronto") {
                qtdProntos++;
                card.innerHTML = `
                    <div class="info-pedido">
                        ${mesaHtml}
                        <span class="nome-convidado">${nomeConvidado}</span>
                        <span class="nome-drink">${nomeExibido}</span>
                        ${badgeHtml}
                        <span class="horario">Pronto às ${horaFormatada}</span>
                    </div>
                    <button class="btn-acao btn-entregar" onclick="mudarStatus('${pedido.id}', 'entregue')">✓ Entregue</button>
                `;
                divProntos.appendChild(card);
            }
        });

        if (qtdPendentes === 0) divPendentes.innerHTML = '<div class="sem-pedidos">Nenhum drink pendente...</div>';
        if (qtdFazendo === 0) divFazendo.innerHTML = '<div class="sem-pedidos">Nenhum drink em preparo...</div>';
        if (qtdProntos === 0) divProntos.innerHTML = '<div class="sem-pedidos">Nenhum drink aguardando retirada...</div>';
    });

    let toastTimer = null;
    function mostrarToast(titulo, mensagem, erro = false) {
        const toast = document.getElementById('toastNotif');
        document.getElementById('toastTitulo').innerText = titulo;
        document.getElementById('toastMensagem').innerText = mensagem;
        document.getElementById('toastIcone').innerText = erro ? '❌' : '✅';
        toast.className = 'toast' + (erro ? ' toast-erro' : '');
        void toast.offsetWidth;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 3500);
    }

    // Carimbo de tempo por status, usado pelo relatório do bar pra calcular o
    // tempo médio de fila (dataHora até horaPronto).
    const camposHoraPorStatus = {
        fazendo: 'horaFazendo',
        pronto: 'horaPronto',
        entregue: 'horaEntregue'
    };

    window.mudarStatus = function(idPedido, novoStatus) {
        const pedidoEspecificoRef = ref(database, `pedidos/${idPedido}`);
        const labelsAcao = {
            fazendo: 'iniciado pelo barman',
            pronto: 'marcado como pronto',
            entregue: 'entregue ao convidado'
        };
        const labelAcao = labelsAcao[novoStatus] || 'atualizado';

        const dadosAtualizacao = { status: novoStatus };
        const campoHora = camposHoraPorStatus[novoStatus];
        if (campoHora) {
            dadosAtualizacao[campoHora] = serverTimestamp();
        }

        update(pedidoEspecificoRef, dadosAtualizacao)
            .then(() => mostrarToast('Status Atualizado', `Pedido ${labelAcao} com sucesso.`))
            .catch((error) => {
                console.error("Erro ao atualizar status:", error);
                mostrarToast('Erro', 'Não foi possível atualizar o status. Verifique a conexão.', true);
            });
    };
</script>

</body>
</html>
